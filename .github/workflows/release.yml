name: Release & Docker Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      is_prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        required: true
        default: false
      release_tag:
        description: 'The tag name for the release (e.g., v1.0.0)'
        type: string
        required: true
      target_commitish:
        description: 'The commitish value that determines where the Git tag is created from. Can be any branch, commit, or tag.'
        type: string
        required: false

jobs:
  # 设置全局变量
  set-globals:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease || inputs.is_prerelease || false }}
      release_tag: ${{ github.event_name == 'release' && github.ref_name || inputs.release_tag }}
      source_sha: ${{ steps.source.outputs.sha }}
      ref_name: ${{ github.event_name == 'release' && github.ref_name || inputs.release_tag }}
      event_name: ${{ github.event_name }}
    steps:
      - name: Resolve source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.ref || inputs.target_commitish || github.sha }}

      - name: Pin source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # 所有测试和产物使用同一个已解析的提交。
  call-test:
    needs: set-globals
    uses: ./.github/workflows/test.yml
    with:
      base_sha: ${{ github.event.before || '' }}
      head_sha: ${{ needs.set-globals.outputs.source_sha }}
    secrets: inherit

  # 交叉编译
  build:
    needs: [set-globals, call-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.set-globals.outputs.source_sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build Binary for ${{ matrix.os }}-${{ matrix.arch }}
        env:
          VERSION: ${{ needs.set-globals.outputs.release_tag }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          if [[ -z "${TVDB_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::Configure the repository Actions secret TVDB_API_KEY before publishing."
            exit 1
          fi
          # 防止密钥中的空白或引号破坏链接器参数；错误不回显密钥。
          if [[ "$TVDB_API_KEY" =~ [[:space:]] || "$TVDB_API_KEY" == *"'"* || "$TVDB_API_KEY" == *'"'* ]]; then
            echo "::error::TVDB_API_KEY must not contain whitespace or quotes."
            exit 1
          fi

          BIN_DIR=./bin
          mkdir -p "$BIN_DIR"
          OUTPUT_NAME="curetmdbanime-${GOOS}-${GOARCH}"

          go build -ldflags "\
            -s -w \
            -X 'curetmdbanime/internal/config.Version=${VERSION}' \
            -X 'curetmdbanime/internal/config.BuiltinTVDBAPIKey=${TVDB_API_KEY}'" \
            -o "${BIN_DIR}/${OUTPUT_NAME}" .

      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: ./bin

  # 复用统一构建的 Linux 二进制，不在 Docker 中重新编译或注入密钥。
  docker_build:
    needs: [set-globals, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.set-globals.outputs.source_sha }}

      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          path: ./bin
          pattern: binaries-linux-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/curetmdbanime
          tags: |
            type=raw,value=latest,enable=${{ needs.set-globals.outputs.is_prerelease == 'false' && needs.set-globals.outputs.event_name == 'release' }}
            type=raw,value=preview,enable=${{ needs.set-globals.outputs.is_prerelease == 'true' }}
            type=raw,value=${{ needs.set-globals.outputs.ref_name }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 发布任务，在 GitHub Release 发布时上传
  release:
    needs: [set-globals, build]
    runs-on: ubuntu-latest
    if: needs.set-globals.outputs.event_name == 'release' || needs.set-globals.outputs.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.set-globals.outputs.source_sha }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: binaries-*

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/**/*
          tag_name: ${{ needs.set-globals.outputs.release_tag }}
          target_commitish: ${{ needs.set-globals.outputs.source_sha }}
          prerelease: ${{ needs.set-globals.outputs.is_prerelease == 'true' }}
          name: ${{ needs.set-globals.outputs.release_tag }}
